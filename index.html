<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jazar App Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Noto+Naskh+Arabic:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* jazar_mono_screens.html, extended: colour is used only where it carries meaning —
   the letters of an inflected form, and one colour per attached part. */
:root{
  --bg:#f2f2f4; --fg:#141417; --muted:#5f5f69; --line:#dcdce2; --surface:#fff;
  --a-page:#fafafb; --a-card:#fff; --a-ink:#111113; --a-rest:#6a6a73; --a-muted:#5c5c66; --a-line:#e3e3e8;
  --a-bar:#0b0b0d; --a-on-bar:#fff; --a-cell:#e6e6eb; --a-bezel:#050506;
  --a-hover:#f6f6f8; --a-sunk:#f1f1f4;
  --a-mark:#ffe9a6; --a-mark-ink:#3a2a00; --a-note:#fff7db; --a-note-ink:#5a4300;
  --a-form:#b45309;                     /* a conjugated or inflected form, as Takoboto's orange reading */
  --p1:#0f766e; --p2:#7c3aed; --p3:#b45309;
  --font-ui:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --font-ar:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;
  --font-head:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c0c0e; --fg:#f0f0f3; --muted:#a2a2ad; --line:#2a2a30; --surface:#17171a;
  --a-page:#0e0e10; --a-card:#17171b; --a-ink:#f2f2f4; --a-rest:#a3a3ad; --a-muted:#9a9aa4; --a-line:#26262c;
  --a-bar:#0b0b0d; --a-cell:#33333b; --a-bezel:#000; --a-hover:#1c1c21; --a-sunk:#15151a;
  --a-mark:#ffe9a6; --a-mark-ink:#3a2a00; --a-form:#f0b34a;
  --p1:#2dd4bf; --p2:#a78bfa; --p3:#f0b34a;
 --a-note:#2a2410; --a-note-ink:#f3dc9a; color-scheme:dark} }
:root[data-theme="dark"]{color-scheme:dark; --a-note:#2a2410; --a-note-ink:#f3dc9a;
  --bg:#0c0c0e; --fg:#f0f0f3; --muted:#a2a2ad; --line:#2a2a30; --surface:#17171a;
  --a-page:#0e0e10; --a-card:#17171b; --a-ink:#f2f2f4; --a-rest:#a3a3ad; --a-muted:#9a9aa4; --a-line:#26262c;
  --a-bar:#0b0b0d; --a-cell:#33333b; --a-bezel:#000; --a-hover:#1c1c21; --a-sunk:#15151a;
  --a-mark:#ffe9a6; --a-mark-ink:#3a2a00; --a-form:#f0b34a;
  --p1:#2dd4bf; --p2:#a78bfa; --p3:#f0b34a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh;display:grid;place-items:center;gap:16px;padding:24px 16px 36px;align-content:center}
.caption{font-size:12.5px;color:var(--muted);text-align:center;max-width:46ch;line-height:1.5}
.caption b{color:var(--fg);font-weight:600}
.cues{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:430px}
.cues button{font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;cursor:pointer;font-family:var(--font-ar)}
.cues button:hover{border-color:#b9b9c2}
.cues button[aria-current="true"]{background:var(--a-mark);border-color:var(--a-mark);color:var(--a-mark-ink)}

/* ── the phone ─────────────────────────────────────────────────── */
.ph{container-type:inline-size;width:100%;max-width:344px;aspect-ratio:9/18.6;background:var(--a-bezel);
  border-radius:42px;padding:9px}
.sc{height:100%;border-radius:34px;overflow:hidden;background:var(--a-page);color:var(--a-ink);
  display:flex;flex-direction:column;font-size:4.8cqw;line-height:1.45;position:relative;
  font-family:var(--font-ui);text-align:left}
.ar{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate}
.st{display:flex;justify-content:space-between;padding:3.2cqw 8cqw .8cqw;font-size:3.6cqw;font-weight:700;color:var(--a-on-bar)}
.top{background:var(--a-bar);color:var(--a-on-bar);flex:none}
.bar{display:flex;align-items:center;gap:2.4cqw;padding:1.6cqw 3.4cqw 2.4cqw;min-height:16cqw}
.ico{width:9.4cqw;height:9.4cqw;flex:none}
.ico img{width:100%;height:100%;display:block;border-radius:22.37%;box-shadow:0 0 0 .3cqw rgb(255 255 255 / .22)}
.back{font-size:6.2cqw;min-height:12cqw;min-width:8cqw;display:grid;place-items:center;color:var(--a-on-bar);
  background:none;border:0;cursor:pointer;font-family:inherit}
.ttl{font-family:var(--font-ar);font-size:7cqw;line-height:1.3}
.ttl.ui{font-family:var(--font-ui);font-size:5.8cqw;font-weight:800;letter-spacing:-.01em}
.field{flex:1;min-width:0;background:var(--a-card);color:var(--a-ink);border-radius:7cqw;height:12.4cqw;
  display:flex;align-items:center;padding:0 1.4cqw 0 4.2cqw;direction:rtl}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--a-ink);
  font-family:var(--font-ar);font-size:6.8cqw;line-height:1;text-align:right;direction:rtl;padding:0}
.field input::placeholder{font-family:var(--font-ui);font-size:4cqw;color:var(--a-rest);direction:ltr;text-align:right}
.clear{width:8.6cqw;height:8.6cqw;border-radius:50%;border:0;background:none;color:var(--a-rest);font-size:4.4cqw;
  display:grid;place-items:center;cursor:pointer;flex:none;direction:ltr;font-family:var(--font-ui)}
.clear[hidden]{display:none}
.tbtn{width:10cqw;height:10cqw;border-radius:50%;border:0;background:none;color:var(--a-on-bar);cursor:pointer;
  display:grid;place-items:center;flex:none;font-size:5cqw}
.tbtn:hover{background:rgb(255 255 255 / .12)}
/* breadcrumb trail: on the page, under the bar (EN9) */
.trail{display:flex;align-items:center;gap:1.4cqw;padding:2.4cqw 4.4cqw 0;font-size:3.4cqw;color:var(--a-muted);
  flex-wrap:nowrap;overflow:hidden;flex:none}
.trail button{background:none;border:0;padding:0;font:inherit;font-size:4.4cqw;color:var(--a-rest);cursor:pointer;
  font-family:var(--font-ar);white-space:nowrap}
.trail button:hover{color:var(--a-ink);text-decoration:underline;text-underline-offset:.5cqw}
.trail .now{color:var(--a-ink);font-family:var(--font-ar);white-space:nowrap;font-size:4.4cqw}
.trail i{color:#b9b9c2;font-style:normal}
.pad{padding:3.4cqw 4.4cqw;display:grid;gap:2.4cqw}
.lab{font-size:3.5cqw;font-weight:600;color:var(--a-muted);letter-spacing:.02em}
.help{font-size:3.7cqw;color:var(--a-muted);line-height:1.5}
.help .ar{font-size:1.3em;color:var(--a-ink)}
.list{background:var(--a-card);border-top:.3cqw solid var(--a-line);border-bottom:.3cqw solid var(--a-line)}
.it{display:grid;gap:.6cqw;padding:2.6cqw 4.4cqw;border-top:.3cqw solid var(--a-line);width:100%;
  background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;
  font-family:inherit;color:inherit;min-height:13cqw}
.it:first-child{border-top:0}
.it:hover{background:var(--a-hover)}
.it.f{padding:2cqw 4.4cqw;min-height:11cqw}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:2cqw}
.lhs{display:flex;align-items:baseline;gap:1.8cqw;min-width:0;flex:1 1 auto;overflow:hidden}
.par{display:flex;gap:2.8cqw;direction:rtl;align-items:baseline;flex:0 0 auto;white-space:nowrap}
.par .p{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;font-size:6.6cqw;line-height:1.65;
  color:var(--a-ink);white-space:nowrap}
.par .p.on{color:var(--a-form)}
.thread{display:flex;justify-content:flex-end;align-items:center;gap:1.6cqw;
  position:relative;margin-top:0;padding:1.1cqw 3.6cqw 1.1cqw 0;min-height:8cqw}
.thread::before{content:"";position:absolute;right:0;top:0;height:50%;width:1.8cqw;
  border-right:.35cqw solid #c2c2cc;border-bottom:.35cqw solid #c2c2cc;border-bottom-right-radius:1.5cqw}
.thread > *{position:relative}
.thread::after{content:"";position:absolute;right:0;top:50%;width:1.7cqw;height:.35cqw;background:#c2c2cc;
  border-top-left-radius:.4cqw}
.thread .cat{font-size:3.7cqw;color:var(--a-muted);white-space:nowrap}
.msline{display:flex;align-items:baseline;gap:1.6cqw;min-width:0;overflow:hidden}
.ms{font-size:4.4cqw;font-weight:600;color:var(--a-ink);letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms0{font-size:3.9cqw;color:var(--a-rest);font-weight:500}
.hw{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;font-size:6.2cqw;line-height:1.6;
  color:var(--a-ink);white-space:nowrap;flex:none}
.sub{display:flex;align-items:baseline;gap:1.6cqw;font-size:3.5cqw;color:var(--a-rest);min-width:0;min-height:7cqw}
.sub .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub .ar{font-size:1.32em;color:var(--a-muted)}
.form{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;font-size:6.4cqw;line-height:1.6;
  color:var(--a-form);white-space:nowrap}
/* the Arabic column stays on the right: headword, then the form under it */
.frow{display:flex;justify-content:flex-end;align-items:baseline;min-height:0}
.frow .lbl{font-size:3.3cqw;color:var(--a-muted);font-family:var(--font-ui);margin-inline-end:2cqw}
.tdef{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;font-size:4.1cqw;line-height:1.95;
  text-align:right;color:var(--a-rest);padding-top:1.2cqw}
.tblock{border-top:.3cqw dashed var(--a-line);margin-top:1.4cqw;padding-top:1.4cqw}
.views{display:grid;gap:0;background:var(--a-card);border:.3cqw solid var(--a-line);border-radius:2.6cqw;overflow:hidden}
.vitem{display:block;width:100%;text-align:left;background:none;border:0;border-top:.3cqw solid var(--a-line);
  padding:2cqw 3.2cqw;cursor:pointer;font-family:inherit;color:inherit}
.vitem:first-child{border-top:0}
.vitem[aria-current="true"]{background:var(--a-sunk)}
.vitem b{font-size:4cqw;font-weight:600;display:block}
.vitem small{font-size:3.2cqw;color:var(--a-muted)}
.from{color:var(--a-muted);font-size:3.4cqw}
.chev{margin-left:auto;width:12.5cqw;height:12.5cqw;border:0;background:none;cursor:pointer;color:var(--a-rest);
  display:grid;place-items:center;flex:none;margin-block:-2cqw}
.chev:hover{background:var(--a-sunk);color:var(--a-ink)}
.chev svg{width:3.4cqw;height:3.4cqw;transition:transform .15s}
.chev[aria-expanded="true"] svg{transform:rotate(180deg)}
.more{padding:0 4.4cqw 2.6cqw;display:grid;gap:1.2cqw;background:var(--a-card);border-bottom:.3cqw solid var(--a-line)}
.more[hidden]{display:none}
.mline{display:flex;gap:2cqw;font-size:3.9cqw;line-height:1.5;color:var(--a-ink)}
.mline .i{color:var(--a-muted);min-width:3.4cqw;flex:none;font-variant-numeric:tabular-nums}
.mline .en{color:var(--a-rest);font-size:3.9cqw}
.tag{font-size:3cqw;color:var(--a-muted);border:.3cqw dashed var(--a-line);border-radius:1.2cqw;
  padding:0 1.4cqw;white-space:nowrap;flex:none;align-self:center}
.welcome{padding:7cqw 7cqw 2cqw;display:grid;gap:2.4cqw;text-align:center;justify-items:center}
.welcome .big{width:22cqw;height:22cqw}
.welcome .big img{width:100%;height:100%;display:block;border-radius:22.37%;box-shadow:0 2cqw 6cqw -2cqw rgb(0 0 0 / .5)}
.welcome h1{margin:0;font-size:6.4cqw;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.welcome p{margin:0;color:var(--a-muted);font-size:4cqw;line-height:1.5;max-width:30ch}
.ex{display:inline-flex;align-items:center;gap:2.2cqw;background:var(--a-card);border:.3cqw solid var(--a-line);
  border-radius:99px;padding:1.2cqw 3.6cqw;font-size:3.8cqw;color:var(--a-muted);cursor:pointer;font-family:inherit}
.ex .ar{font-size:6cqw;line-height:1.4;color:var(--a-ink)}
/* the compound word: letters, then one Malay line in the same colours */
.whole{text-align:center;font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;
  font-size:13cqw;line-height:1.55;font-weight:600}
.whole span{}
.whole .p1{color:var(--p1)} .whole .p2{color:var(--p2)} .whole .p3{color:var(--p3)} .whole .s{color:var(--a-ink)}
.gloss{direction:ltr;font-size:4.4cqw;line-height:1.5;color:var(--a-ink);
  display:flex;flex-wrap:wrap;gap:0;justify-content:center;font-weight:700}
.gloss span{white-space:pre;font-weight:700}
.gloss .p1{color:var(--p1)} .gloss .p2{color:var(--p2)} .gloss .p3{color:var(--p3)} .gloss .s{color:var(--a-ink);font-weight:600}
.gloss .lbl{color:var(--a-muted);font-size:3.6cqw;align-self:baseline}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:3cqw;padding:2.6cqw 4.4cqw .4cqw}
.hd .word{font-family:var(--font-head);font-size:13cqw;line-height:1.45;direction:rtl;unicode-bidi:isolate}
.hd .pos{font-size:3.4cqw;color:var(--a-muted);padding-bottom:3cqw;display:grid;gap:.6cqw;text-align:left}
.hd .pos .ar{font-size:1.4em;color:var(--a-ink);line-height:1.5}
.tabs{display:flex;gap:6cqw;padding:0 4.4cqw;border-bottom:.3cqw solid var(--a-line);flex:none}
.tabs button{background:none;border:0;font:inherit;font-size:4.1cqw;font-weight:600;color:var(--a-rest);
  padding:2.4cqw 0;cursor:pointer;position:relative;min-height:13cqw}
.tabs button.on{color:var(--a-ink)}
.tabs button.on::after{content:"";position:absolute;left:0;right:-2cqw;bottom:-.3cqw;height:1cqw;background:var(--a-ink)}
.scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.mbox{background:var(--a-card);border:.3cqw solid var(--a-line);border-radius:2.6cqw;padding:2.2cqw 3.2cqw;
  display:grid;gap:.6cqw}
.mbox .r1{display:flex;align-items:baseline;gap:2.2cqw}
.mbox .n{font-size:3.4cqw;color:var(--a-muted)}
.mbox .w{font-size:5.2cqw;font-weight:600;letter-spacing:-.01em}
.mbox .en{font-size:3.9cqw;color:var(--a-rest);padding-left:5.6cqw;line-height:1.45}
.mbox .tag{margin-left:auto}
.slot{border:.4cqw dashed #b8b8c2;border-radius:2.6cqw;padding:2cqw 3.2cqw;display:grid;gap:.8cqw}
.slot .val{font-size:3.9cqw;line-height:1.7}
.slot .val .ar{font-size:1.4em}
.linkbtn{background:none;border:0;padding:0;font-family:inherit;font-size:3.7cqw;color:var(--a-muted);
  text-decoration:underline;text-decoration-color:var(--a-line);text-underline-offset:.7cqw;cursor:pointer;justify-self:start}
.linkbtn:hover{color:var(--a-ink)}
.menu{display:flex;justify-content:space-between;align-items:center;background:var(--a-card);width:100%;
  border:.3cqw solid var(--a-line);border-radius:3cqw;padding:2cqw 3.2cqw;cursor:pointer;font-family:inherit;
  color:inherit;text-align:left}
.menu b{font-size:4.2cqw;font-weight:600}
.menu small{display:block;font-size:3.2cqw;color:var(--a-muted)}
.grid{background:var(--a-card);border:.3cqw solid var(--a-line);border-radius:2.6cqw;overflow:hidden}
.grid h4{margin:0;display:flex;justify-content:space-between;align-items:baseline;padding:1.8cqw 2.8cqw;
  border-bottom:.3cqw solid var(--a-line);font-size:3.9cqw;font-weight:600}
.grid h4 small{font-weight:500;color:var(--a-muted);font-size:3.3cqw}
.grid h4 .ar{font-size:5.2cqw;font-weight:400;line-height:1.4}
.grid table{width:100%;border-collapse:collapse;table-layout:fixed;direction:rtl}
.grid col.lb{width:23%}
.grid th{font-family:var(--font-ar);font-weight:400;font-size:4.2cqw;color:var(--a-muted);padding:.8cqw 0;line-height:1.5}
.grid td{border-top:.3cqw solid var(--a-line);border-left:.3cqw solid var(--a-line);text-align:center;
  padding:1.2cqw .3cqw;vertical-align:middle;height:14cqw}
.grid td:last-child{border-left:0}
.grid td.r{font-family:var(--font-ar);font-size:4cqw;color:var(--a-muted);line-height:1.5}
.grid td small{display:block;font-family:var(--font-ar);font-size:3.7cqw;line-height:1.35;color:var(--a-muted)}
.grid td b{display:block;font-family:var(--font-ar);font-weight:400;font-size:5.8cqw;line-height:1.5}
.grid td.me{background:var(--a-cell)}
.grp{font-size:3.4cqw;font-weight:600;color:var(--a-muted);padding:3cqw 4.4cqw 1cqw;display:flex;
  justify-content:space-between;align-items:baseline;gap:2cqw}
.grp .ar{font-size:3.9cqw;color:var(--a-rest);font-weight:400}
.grp span:last-child{color:var(--a-rest);font-variant-numeric:tabular-nums}
.k .hw{color:var(--a-rest);font-size:5.4cqw}
.k .hw b{color:var(--a-ink);font-weight:400}
.k .sm{font-size:3.3cqw;color:var(--a-rest)}
.k .sm .ar{font-size:1.3em}
.k .ms{font-size:3.9cqw;font-weight:500}
.k .it.here{background:var(--a-sunk);cursor:default}
.pill{font-size:2.8cqw;color:var(--a-muted);border:.3cqw solid var(--a-line);border-radius:1.2cqw;padding:0 1.2cqw}

/* ── suggestions ─────────────────────────────────────────────── */
.mbtn{width:10.4cqw;height:10.4cqw;border-radius:50%;border:0;background:none;color:var(--a-on-bar);cursor:pointer;display:grid;place-items:center;flex:none}
.mbtn:hover{background:rgb(255 255 255 / .12)}
.mbtn svg{width:5.6cqw;height:5.6cqw}
.fbtn{width:9cqw;height:9cqw;border-radius:50%;border:0;background:none;color:var(--a-rest);cursor:pointer;display:grid;place-items:center;flex:none}
.fbtn[aria-pressed="true"]{background:var(--a-sunk);color:var(--a-ink)}
.fbtn svg{width:5.4cqw;height:5.4cqw}
.kb{flex:none;background:var(--a-sunk);border-top:.3cqw solid var(--a-line);padding:2cqw 1.4cqw 3cqw;display:grid;gap:1.6cqw;direction:ltr}
.kb .r{display:flex;gap:1cqw;justify-content:center}
.kb .marks button{background:none;box-shadow:none;border:.3cqw solid var(--a-line);font-family:"Amiri",var(--font-ar);font-size:7cqw;line-height:1;color:var(--a-ink);padding-bottom:1cqw}
.kb button.del{flex:1.6;font-size:4.6cqw}
.kb button.sp{flex:5}
.kb button{flex:1;min-width:0;height:10.6cqw;border:0;border-radius:1.8cqw;background:var(--a-card);color:var(--a-ink);
  font-family:var(--font-ar);font-size:5.4cqw;cursor:pointer;box-shadow:0 .3cqw 0 var(--a-line);padding:0}
.kb button.w{flex:2.4;font-family:var(--font-ui);font-size:3.6cqw;font-weight:600}
.kb button.go{background:var(--a-ink);color:var(--a-page)}
.sheet{position:absolute;inset:0;background:rgb(0 0 0 / .38);display:flex;align-items:flex-start;justify-content:flex-end;z-index:5}

function dhamir(cell){
  if (!cell) return '';

  return arr[cell.number === 'sg' ? 0 : cell.number === 'du' ? 1 : 2];
}

function grammar(r, e){
  const bits = [];
  if (r && r.cell && r.cell.aspect) bits.push(TENSE[r.cell.aspect]);
  if (r && r.cell && r.cell.person){

  return bits.join(' · ');
}

/* the paradigm, inline: a verb shows its three heads, a noun its singular and plural */
function paradigm(e){
  const out = [];
  if (e.pos === 'verb'){
    out.push({ t: e.d, k: 'perf' });
    const imp = cellsOf(e, 'imperf', 'act', 'ind')['3msg'];

    if (amr) out.push({ t: amr, k: 'imper' });
  } else {
    out.push({ t: e.d, k: 'sg' });
    const pl = (e.forms || []).find(f => f.number === 'pl' && f.d !== e.d);
    if (pl) out.push({ t: pl.d, k: 'pl' });
  }
  return out;
}

function formCat(r){

  if (r.cell && r.cell.aspect) return TENSE[r.cell.aspect];
  if (r.plural) return 'jamak';
  if (r.dual) return 'muthanna';
  if (r.cell && r.cell.gender === 'f') return 'muannas';
  return '';
}

const VF_ORDER = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'QI', 'QII', 'QIII', 'QIV'];
const KSEC = [
  { k:'verb', ms:"Fi'il", ar:'فِعْل' },

const SIFAT_NAME = { comparative:'lebih', nisba:'nisbah', intensive:'sangat', assimilated_adj:'sifat' };
const NOUN_NAME = { place:'tempat', time:'masa', instrument:'alat', unit:'sekali' };
function kindOf(x){
  if (x.pos === 'verb') return 'verb';
  const r = (x.rel || []).map(a => a[0]);
  if (['masdar', 'masdar_mimi', 'ism_masdar'].includes(x.nk) || r.includes('masdar_of')) return 'masdar';
  if (x.nk === 'act_part' || r.includes('act_part_of')) return 'fa';
  if (x.nk === 'pass_part' || r.includes('pass_part_of')) return 'mf';
  if (SIFAT_NAME[x.nk] || r.some(t => ['assim_adj_of', 'intensive_of', 'nisba_of', 'comparative_of'].includes(t))) return 'sifat';
  return 'noun';
}
function kaitanTab(page){
  const e = E[page.lid];
  const ids = [...new Set([String(e.id), ...(e.family || []).map(x => String(x.id))])].filter(id => KIN[id]);
  if (ids.length < 2) return `<div class="pad"><div class="help">Tiada kata lain daripada kata dasar ini.</div></div>`;
  const root = [...(e.root || '')];
  const lit = word => { let k = 0;
    return (word.match(/.([\u064B-\u065F]|\u0670)*/gu) || []).map(c =>
      (k < root.length && c[0] === root[k]) ? (k++, `<b>${esc(c)}</b>`) : esc(c)).join(''); };
  const from = x => { const t = (x.rel || []).map(a => KIN[a[1]]).find(Boolean);
    return t ? `daripada <span class="ar" lang="ar" dir="rtl">${esc(t.d)}</span>` : ''; };
  const typeLine = (x, k) => {
    if (k === 'verb') return x.vf === 'I' ? 'mujarrad' : (x.vf || '').startsWith('Q') ? "ruba'i" : `mazid · <span class="ar" lang="ar" dir="rtl">${VF_PAT[x.vf] || ''}</span>`;
    const f = from(x);
    if (k === 'sifat') return [SIFAT_NAME[x.nk] || '', f].filter(Boolean).join(' · ');
    if (k === 'noun') return NOUN_NAME[x.nk] || f;
    return f;
  };
  const meaning = (id, x) => {
    const f = E[id], m = f && (f.meanings || [])[0];
    if (m) return `<span class="ms">${esc(m.ms)}</span>`;
    if (x.ms) return `<span class="ms">${esc(x.ms)}</span>`;
    const en = (f && (f.english || [])[0]) || x.en;
    return en ? `<span class="msline"><span class="tag">EN</span><span class="ms0">${esc(en)}</span></span>` : '<span class="ms0">Makna belum ada</span>';
  };
  /* words with no Malay and no English yet stay hidden, except the word you are on */
  const known = id => { const f = E[id], x = KIN[id];
    return (f && ((f.meanings || []).length || (f.english || []).length)) || x.ms || x.en; };
  const items = ids.filter(id => id === String(e.id) || known(id)).map(id => ({ id, x: KIN[id], k: kindOf(KIN[id]) }));
  return KSEC.map(sec => {
    let rows = items.filter(it => it.k === sec.k);
    if (!rows.length) return '';
    if (sec.k === 'verb') rows.sort((a, b) => VF_ORDER.indexOf(a.x.vf) - VF_ORDER.indexOf(b.x.vf));
    return `<div class="grp"><span>${esc(sec.ms)} · <span class="ar" lang="ar" dir="rtl">${sec.ar}</span></span><span>${rows.length}</span></div>
      <div class="list k">${rows.map(({ id, x, k }) => {
        const here = id === String(e.id), tl = typeLine(x, k);
        return `<button class="it f${here ? ' here' : ''}" type="button" ${!here && E[id] ? `data-word="${id}"` : ''}>
          <span class="row"><span class="kl">${meaning(id, x)}${here || tl ? `<span class="ty">${here ? '<b class="you">ANDA DI SINI</b>' + (tl ? ' · ' : '') : ''}${tl}</span>` : ''}</span>
          <span class="hw">${lit(x.d)}</span></span></button>`;
      }).join('')}</div>`;
  }).join('') + '<div style="height:6cqw"></div>';
}

function wordBody(page){
  const e = E[page.lid];
  const tabs = [['makna', 'Makna'], [e.pos === 'verb' ? 'tasrif' : 'bentuk', e.pos === 'verb' ? 'Tasrif' : 'Bentuk'], ['kaitan', 'Kaitan']];
  const cur = page.ui.tab || 'makna';
  const body = cur === 'makna' ? maknaTab(page) : cur === 'tasrif' ? tasrifTab(page) : cur === 'bentuk' ? bentukTab(page) : kaitanTab(page);
  const pat = patternOf(e), tr = TRANS[e.trans] || '';
  const pos = `<span>${esc(POS[e.pos] || e.posMs || '')}${pat ? ' · ' + ar(pat) : ''}</span>${tr ? `<span>${esc(tr)}</span>` : ''}`;
  const rootChip = e.root ? `<button class="root" type="button" data-tab="kaitan">Kata dasar <span class="ar" lang="ar" dir="rtl">${esc([...e.root].join(' '))}</span></button>` : '';
  return `<div class="hd"><span class="pos">${pos}${rootChip}</span><span class="word">${esc(e.d)}</span></div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === cur}" class="${k === cur ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="scroll">${body}</div>`;
}

  if (p.k === 'home') sc.innerHTML = barSearch('', true) + `<div class="scroll">${homeBody()}</div>` + kbPanel();
  else if (p.k === 'results') sc.innerHTML = barSearch(p.q) + trail() + `<div class="scroll">${resultsBody(p)}</div>` + kbPanel();

}
function wire(){
  const input = document.getElementById('q');

      if (!v.trim()){ home(); return; }
      let page = curPage();
      if (page.k !== 'results'){ stack.length = 1; stack.push({ k:'results', q:v, title:v, ui:{} }); page = curPage(); }
      page.q = v;
      const sc = document.getElementById('sc');

  }

  if (clr) clr.addEventListener('click', () => { if (input) input.value = ''; home(); });
}

  if (t.dataset.word){ const id = t.dataset.word; const p = curPage(); return go({ k:'word', lid:id, row: p.k === 'results' ? rowFor(p.q, id) : null }); }
  if (t.dataset.entry) return go({ k:'word', lid:t.dataset.entry, row:null });
  if (t.dataset.tab) return setUi(curPage(), 'tab', t.dataset.tab);
  if (t.dataset.defs !== undefined) return setUi(curPage(), 'defs', !curPage().ui.defs);
});
function rowFor(q, id){
  const d = Q[q];
  if (!d || !d.rows) return null;
  return d.rows.find(r => r.lid == id || r.lids.includes(+id)) || null;
}

/* the cues: only words that have a Malay meaning, plus the no-match one */
CUES = [...DATA.queries.filter(q => q.rows.some(r => hasMs(E[r.lid]))).map(q => q.q), PARTS_Q.q];
document.getElementById('cues').innerHTML = CUES.map(q => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('');
document.getElementById('cues').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  stack.length = 1; go({ k:'results', q: b.dataset.q, title: b.dataset.q });
});
try { if (matchMedia('(prefers-color-scheme: dark)').matches && !document.documentElement.dataset.theme) document.documentElement.dataset.theme = 'dark'; } catch (e) {}
paint();
</script>
