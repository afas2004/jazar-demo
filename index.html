<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jazar demo</title>
<meta name="description" content="Jazar: kamus Arab–Melayu luar talian. Taip perkataan Arab tepat seperti dalam teks. Demo bukti konsep.">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=Aref+Ruqaa:wght@700&family=Noto+Naskh+Arabic:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --page: #fafafb; --card: #ffffff; --ink: #111113; --rest: #6f6f79; --muted: #5f5f69; --line: #e3e3e8;
  --bar1: #2e2e35; --bar2: #0b0b0d; --onbar: #ffffff; --cell: #e6e6eb; --mark: #ffe9a6; --markink: #3a2a00;
  --p1: #0f766e; --p2: #7c3aed; --p3: #b45309; --p4: #be123c;
  --ui: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --ar: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
  --head: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0f0f11; --card: #18181b; --ink: #f2f2f4; --rest: #a3a3ad; --muted: #a8a8b2; --line: #2b2b31; --cell: #2c2c33;
  --mark: #5a4a12; --markink: #fff3c4; --p1: #2dd4bf; --p2: #a78bfa; --p3: #f59e0b; --p4: #fb7185; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #0f0f11; --card: #18181b; --ink: #f2f2f4; --rest: #a3a3ad; --muted: #a8a8b2; --line: #2b2b31;
  --cell: #2c2c33; --mark: #5a4a12; --markink: #fff3c4; --p1: #2dd4bf; --p2: #a78bfa; --p3: #f59e0b; --p4: #fb7185; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 16px/1.5 var(--ui); -webkit-text-size-adjust: 100%; }
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; background: var(--page); position: relative; }
.ar { font-family: var(--ar); direction: rtl; unicode-bidi: isolate; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.top { position: sticky; top: 0; z-index: 5; background: linear-gradient(180deg, var(--bar1), var(--bar2)); color: var(--onbar);
  padding: max(10px, env(safe-area-inset-top)) 12px 12px; }
.bar { display: flex; align-items: center; gap: 10px; min-height: 52px; }
.ico { width: 40px; height: 40px; flex: none; display: block; }
.ico svg, .big svg { width: 100%; height: 100%; display: block; border-radius: 22.37%; }
.ico svg { box-shadow: 0 0 0 1px rgb(255 255 255 / .22); }
.field { flex: 1; min-width: 0; display: flex; align-items: center; background: #fff; border-radius: 26px; height: 48px; padding: 0 6px 0 4px; }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: #111113; font: 24px/1.2 var(--ar); direction: rtl; text-align: right; padding: 0 12px; height: 100%; }
.field input::placeholder { font: 15px var(--ui); color: #6f6f79; direction: ltr; }
.clear { width: 40px; height: 40px; border-radius: 50%; color: #5f5f69; font-size: 22px; display: grid; place-items: center; flex: none; }
.clear[hidden] { display: none; }
.back { font-size: 26px; width: 44px; height: 44px; display: grid; place-items: center; flex: none; color: var(--onbar); }
.ttl { font-family: var(--head); font-size: 28px; line-height: 1.3; direction: rtl; unicode-bidi: isolate; }
.pad { padding: 14px 16px; display: grid; gap: 12px; }
.lab { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.help { font-size: 14.5px; color: var(--muted); }
.help .ar { font-size: 1.3em; color: var(--ink); }
.note { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--muted); display: grid; gap: 4px; }
.note b { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; display: inline-flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 2px 16px; font: 22px/1.4 var(--ar); direction: rtl; color: var(--ink); }
.chip:active { background: var(--cell); }
.welcome { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 22px 16px 4px; }
.big { width: 92px; height: 92px; }
.big svg { box-shadow: 0 8px 24px -8px rgb(0 0 0 / .5); }
.welcome h1 { margin: 6px 0 0; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; }
.welcome p { margin: 0; color: var(--muted); font-size: 15px; max-width: 34ch; }
.list { background: var(--card); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.it { display: grid; gap: 2px; padding: 10px 16px; border-top: 1px solid var(--line); width: 100%; text-align: left; min-height: 56px; }
.it:first-child { border-top: 0; }
button.it:active { background: var(--cell); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ms { font-size: 18px; font-weight: 800; }
.ms small { font-weight: 500; font-size: 13px; color: var(--rest); }
.en { font-size: 15px; font-weight: 600; }
.none { font-size: 14px; color: var(--rest); font-weight: 500; }
.hw { font-family: var(--ar); direction: rtl; unicode-bidi: isolate; font-size: 26px; line-height: 1.55; color: var(--ink); white-space: nowrap; }
.sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--rest); flex-wrap: wrap; }
.sub .ar { font-size: 1.35em; }
.mark { font-family: var(--ar); direction: rtl; unicode-bidi: isolate; font-size: 20px; line-height: 1.5; background: var(--mark); color: var(--markink); border-radius: 6px; padding: 0 7px; margin-left: auto; }
.tag { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; margin-left: 6px; vertical-align: 2px; }
.whole { text-align: center; font-family: var(--ar); direction: rtl; font-size: 48px; line-height: 1.6; font-weight: 600; }
.c0 { color: var(--p1); } .c1 { color: var(--p2); } .c2 { color: var(--p4); } .cx { color: var(--p3); } .cs { color: var(--ink); }
.legend { display: grid; gap: 4px; }
.legend div { display: flex; justify-content: space-between; align-items: center; font-size: 14.5px; }
.legend .ar { font-size: 24px; line-height: 1.3; font-weight: 600; }
.legend small { color: var(--rest); }
details.more > summary { list-style: none; cursor: pointer; padding: 12px 16px; font-size: 14px; font-weight: 700; color: var(--muted); min-height: 44px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more[open] > summary { border-bottom: 1px solid var(--line); }
/* word page */
.page { position: fixed; inset: 0; z-index: 10; background: var(--page); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.page .app { min-height: 100%; }
.hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 10px 16px 2px; }
.hd .word { font-family: var(--head); font-size: 46px; line-height: 1.5; direction: rtl; unicode-bidi: isolate; }
.hd .pos { font-size: 13.5px; color: var(--muted); padding-bottom: 12px; display: grid; gap: 2px; }
.hd .pos .ar { font-size: 1.35em; color: var(--ink); }
.tabs { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 76px; background: var(--page); z-index: 4; }
.tabs button { flex: 1; text-align: center; padding: 12px 0; font-size: 15px; font-weight: 700; color: var(--rest); min-height: 48px; }
.tabs .on { color: var(--ink); box-shadow: inset 0 -3px 0 var(--ink); }
.mbox { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; display: grid; gap: 2px; }
.mbox .r1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.mbox .n { font-size: 13px; color: var(--muted); }
.mbox .w { font-size: 20px; font-weight: 800; }
.mbox .w.e { font-size: 17px; font-weight: 600; }
.mbox .s { font-size: 14px; color: var(--rest); padding-left: 20px; }
.typed { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.typed .mark { margin-left: 0; font-size: 19px; }
.tiles { display: flex; gap: 6px; direction: rtl; }
.tiles span { font: 600 22px/1 var(--ar); width: 40px; height: 40px; display: grid; place-items: center; background: var(--ink); color: var(--page); border-radius: 8px; }
.grid { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.grid h3 { margin: 0; display: flex; justify-content: space-between; align-items: baseline; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 15px; }
.grid h3 small { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.grid h3 .ar { font-size: 20px; font-weight: 400; }
.grid table { width: 100%; border-collapse: collapse; table-layout: fixed; direction: rtl; }
.grid th { font: 400 13px var(--ar); color: var(--muted); padding: 2px 0; }
.grid td { border-top: 1px solid var(--line); border-left: 1px solid var(--line); text-align: center; padding: 3px 2px; }
.grid td:last-child { border-left: 0; }
.grid td.r { font: 12.5px var(--ar); width: 20%; color: var(--muted); }
.grid td small { display: block; font: 11px/1.3 var(--ar); color: var(--muted); }
.grid td b { font: 400 18px/1.55 var(--ar); }
.grid td.me { background: var(--cell); }
.grp { font-size: 12.5px; font-weight: 700; color: var(--muted); padding: 14px 16px 4px; letter-spacing: .04em; text-transform: uppercase; }
.k .hw { color: var(--rest); font-size: 24px; }
.k .hw b { color: var(--ink); font-weight: 400; }
.k .sm { font-size: 13px; color: var(--rest); }
.k .ms { font-size: 16px; }
.k .en { font-size: 14.5px; }
.forms .it { min-height: 48px; }
footer { padding: 18px 16px 40px; font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; }
footer a { color: inherit; }
@media (prefers-reduced-motion: no-preference) { .page { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>
</head>

<script>
const ICON = document.querySelector('.ico').innerHTML;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ar = s => `<span class="ar">${esc(s)}</span>`;
let IDX = null; const SHARDS = {};
const DIA = /[ؐ-ًؚ-ٰٟۖ-ۭـ​-‏‪-‮⁦-⁩﻿]/g;
const MAP = { 'ی': 'ي', 'ے': 'ي', 'ې': 'ي', 'ک': 'ك', 'ڪ': 'ك', 'ہ': 'ه', 'ھ': 'ه', 'ە': 'ه', 'ۀ': 'ة', 'ۃ': 'ة', 'ۓ': 'ئ', 'ٸ': 'ئ', 'ٶ': 'ؤ', 'ٵ': 'أ', 'ٲ': 'أ', 'ٳ': 'إ' };
const canon = s => [...(s || '').normalize('NFKC')].map(c => MAP[c] ?? c).join('').replace(DIA, '').replace(/[^ء-ي]/g, '');
const fold = s => s.replace(/[أإآٱ]/g, 'ا').replace(/[ؤئ]/g, 'ء');
const key = s => fold(canon(s));

function meaningLine(e, plural) {
  if (e.ms) {
    let ms = e.ms, extra = '';
    if (plural && e.p === 'noun') {
      const [w, ...rest] = ms.split(/(?=[ ;,])/);
      if (!w.includes('-')) { extra = ` <small>tunggal: ${esc(ms)}</small>`; ms = `${w}-${w}${rest.join('')}`; }
    }
    return `<span class="ms">${esc(ms)}<span class="tag" title="Makna ini belum disemak oleh editor">draf</span>${extra}</span>`;
  }
  if (e.en) return `<span class="en"><span class="tag" style="margin:0 6px 0 0">EN</span>${esc(e.en)}</span>`;
  return `<span class="none">Makna belum ada</span>`;
}
function labels(lab) {
  return lab.map(x => x.startsWith('wazan @') ? 'wazan ' + ar(x.slice(7)) : x.startsWith('@') ? ar(x.slice(1)) : esc(x)).join(' · ');
}

function home() {
  const m = IDX.meta;
  $('#main').innerHTML = `
    <section class="welcome"><span class="big" aria-hidden="true">${ICON}</span>
      <h1>Jazar</h1><p>Kamus Arab–Melayu. Taip perkataan Arab tepat seperti dalam teks: dengan imbuhan, dengan atau tanpa baris.</p></section>
    <div class="pad">
      <div class="lab">Cuba perkataan ini · Try these</div>
      <div class="chips">${m.suggest.map(w => `<button class="chip" data-q="${esc(w)}">${esc(w)}</button>`).join('')}</div>
      <div class="note"><b>Demo bukti konsep · Proof of concept</b>
        <span>Senarai perkataan tetap: ${m.queries.toLocaleString('en')} bentuk perkataan sekolah dan kata dasarnya. Makna Melayu ialah draf dan masih disemak.</span>
        <span>A fixed list of ${m.queries.toLocaleString('en')} school word forms. Every result is precomputed by the real Jazar engine; Malay meanings are drafts still under review.</span></div>
    </div>`;
}

function parts(r, typed) {   // the typed word, whole, each attached part in its own colour
  const pre = r.parts.filter(p => p.r === 'p'), suf = r.parts.filter(p => p.r === 'x');
  if (!pre.length && !suf.length) return '';
  const c = canon(typed), k = fold(c), P = pre.map(p => p.t).join(''), X = suf.map(p => p.t).join('');
  if (!k.startsWith(P) || !k.endsWith(X) || k.length <= P.length + X.length) return '';
  let i = 0, html = '';
  pre.forEach((p, n) => { html += `<span class="c${Math.min(n, 2)}">${esc(c.slice(i, i + p.t.length))}</span>`; i += p.t.length; });
  html += `<span class="cs">${esc(c.slice(i, c.length - X.length))}</span>`;
  if (X) html += `<span class="cx">${esc(c.slice(c.length - X.length))}</span>`;
  const leg = [...pre.map((p, n) => [p, 'c' + Math.min(n, 2)]), ...suf.map(p => [p, 'cx'])]
    .map(([p, cl]) => `<div><span>${esc(p.ms)} <small>· ${esc(p.en)}</small></span><span class="ar ${cl}">${esc(p.t)}</span></div>`).join('');
  return `<div class="whole">${html}</div><div class="legend">${leg}</div>`;
}

function row(r, i) {
  return `<button class="it" data-open="${i}"><div class="row">${meaningLine(r, r.pl)}<span class="hw">${esc(r.d)}</span></div>
    <div class="sub"><span>${labels(r.lab)}</span>${r.form ? `<span class="mark">${esc(r.form)}</span>` : ''}</div></button>`;
}

let CURRENT = [];
function show(text) {
  const words = (text || '').trim().split(/\s+/).filter(w => canon(w));
  $('#clear').hidden = !text;
  const url = new URL(location.href);
  if (words.length) url.searchParams.set('q', text.trim()); else url.searchParams.delete('q');
  history.replaceState(history.state, '', url);
  if (!words.length) return home();
  const typed = words[0], k = key(typed), hit = IDX.q[k];
  const many = words.length > 1 ? `<div class="help">Demo ini mencari satu perkataan sahaja: ${ar(typed)}. · One word at a time.</div>` : '';
  if (!hit) {
    $('#main').innerHTML = `<div class="pad">${many}
      <div class="help">${ar(typed)} tiada dalam senarai demo.</div>
      <div class="note"><b>Belum ada dalam demo ini · Not in this demo yet</b>
        <span>Demo ini memuatkan ${IDX.meta.queries.toLocaleString('en')} perkataan tetap sahaja; aplikasi penuh mencari 2 juta bentuk perkataan.</span>
        <span>This demo holds a fixed word list only; the full app searches 2 million word forms offline.</span></div>
      <div class="lab">Cuba perkataan ini · Try these</div>
      <div class="chips">${IDX.meta.suggest.map(w => `<button class="chip" data-q="${esc(w)}">${esc(w)}</button>`).join('')}</div></div>`;
    return;
  }
  CURRENT = hit.r;
  const main = CURRENT.filter(r => !r.fold), more = CURRENT.filter(r => r.fold);
  const n = CURRENT.length;
  $('#main').innerHTML = `<div class="pad">${many}${parts(CURRENT[0], typed)}
      <div class="help">${n === 1 ? '1 bacaan' : n + ' bacaan'} untuk ${ar(typed)}${n > 1 ? '. Susunan ikut kemungkinan; pilih ikut makna.' : '.'}</div></div>
    <div class="list">${main.map(r => row(r, CURRENT.indexOf(r))).join('')}</div>
    ${more.length ? `<details class="more"><summary>Bacaan lain (${more.length}) ⌄</summary><div class="list">${more.map(r => row(r, CURRENT.indexOf(r))).join('')}</div></details>` : ''}`;
}

async function shard(id) {
  const n = String(id % 32).padStart(2, '0');
  if (!SHARDS[n]) SHARDS[n] = fetch(`data/s${n}.json`).then(r => r.json());
  return SHARDS[n];
}
const SLOTS = { past: 'perf', pres: 'imperf', cmd: 'imper' };
const ROWS = [['غائب', '3m', ['هُوَ', 'هُمَا', 'هُمْ']], ['غائبة', '3f', ['هِيَ', 'هُمَا', 'هُنَّ']], ['مخاطب', '2m', ['أَنْتَ', 'أَنْتُمَا', 'أَنْتُمْ']], ['مخاطبة', '2f', ['أَنْتِ', 'أَنْتُمَا', 'أَنْتُنَّ']]];
function grid(t, title, small, arTitle, me, onlySecond) {
  if (!t) return '';
  const cell = (k, pr, span) => t[k] ? `<td${span ? ' colspan="2"' : ''} class="${t[k] === me ? 'me' : ''}"><small>${pr}</small><b>${esc(t[k])}</b></td>` : `<td${span ? ' colspan="2"' : ''}></td>`;
  let rows = ROWS.filter(([, k]) => !onlySecond || k[0] === '2').map(([lab, k, pr]) => {
    const du = k[0] === '2' ? '2cdu' : k + 'du';
    return `<tr><td class="r">${lab}</td>${cell(k + 'sg', pr[0])}${cell(du, pr[1])}${cell(k + 'pl', pr[2])}</tr>`;
  }).join('');
  if (!onlySecond) rows += `<tr><td class="r">متكلم</td>${cell('1csg', 'أَنَا')}${cell('1cpl', 'نَحْنُ', true)}</tr>`;
  return `<div class="grid"><h3><span>${title} <small>${small}</small></span><span class="ar">${arTitle}</span></h3>
    <table><thead><tr><th></th><th>مفرد</th><th>مثنى</th><th>جمع</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function lit(word, root) {   // kata dasar letters stay black, the rest grey
  const R = [...fold(root || '')]; let k = 0;
  return (word.match(/.[ً-ٰٟ]*/gu) || []).map(c => (k < R.length && fold(c[0]) === R[k]) ? (k++, `<b>${esc(c)}</b>`) : esc(c)).join('');
}

const STACK = [];
async function openEntry(id, ctx, push = true) {
  const s = await shard(id); const e = s.e[id];
  if (!e) return;
  const fam = e.rid != null ? (await shard(e.rid)).f[e.rid] : null;
  if (push) { STACK.push({ id, ctx }); history.pushState({ depth: STACK.length }, ''); }
  render(id, e, fam, ctx, 0);
}
function render(id, e, fam, ctx, tab) {
  const isVerb = e.pos === 'verb';
  const tabs = ['Makna', isVerb ? 'Tasrif' : 'Bentuk', 'Kaitan'];
  const pos = [esc(e.kind) + (e.pat ? ' · ' + (e.vfI ? '' : 'wazan ') + ar(e.pat) : ''), e.trans ? esc(e.trans) : ''].filter(Boolean).map(x => `<span>${x}</span>`).join('');
  let body = '';
  if (tab === 0) {
    const typed = ctx && ctx.form && ctx.form !== e.d ? `<div class="typed">Anda taip <span class="mark">${esc(ctx.form)}</span> <span>${labels(ctx.lab)}</span></div>` : '';
    const ms = e.ms.map((m, i) => `<div class="mbox"><div class="r1"><span class="n">${i + 1}</span><span class="w">${esc(m.ms)}</span><span class="tag" title="Makna ini belum disemak oleh editor">draf</span></div>
        ${m.more ? `<div class="s">juga: ${esc(m.more)}</div>` : ''}${m.en ? `<div class="s">EN · ${esc(m.en)}</div>` : ''}</div>`).join('');
    const en = !e.ms.length && e.en.length ? e.en.map((g, i) => `<div class="mbox"><div class="r1"><span class="n">${i + 1}</span><span class="tag" style="margin:0">EN</span><span class="w e">${esc(g)}</span></div></div>`).join('') : '';
    const enMore = e.ms.length && e.en.length ? `<div class="lab">English</div><div class="help">${e.en.map(esc).join(' · ')}</div>` : '';
    const root = e.root ? `<div class="lab">Kata dasar · root</div><div class="tiles">${[...e.root].map(c => `<span>${esc(c)}</span>`).join('')}</div>` : '';
    body = `<div class="pad">${typed}${ms}${en}${!ms && !en ? '<div class="help">Makna belum ada dalam demo ini.</div>' : ''}${enMore}${root}</div>`;
  } else if (tab === 1 && isVerb) {
    const t = e.tasrif || {}, me = ctx && ctx.form;
    body = `<div class="pad"><div class="help">Tasrif asas: madhi, mudhari' dan amar (ma'lum).</div>
      ${grid(t.perf, 'Madhi', 'lampau', 'الماضي', me)}${grid(t.imperf, "Mudhari'", 'kini', 'المضارع', me)}${grid(t.imper, 'Amar', 'suruhan', 'الأمر', me, true)}
      ${!e.tasrif ? '<div class="help">Tasrif tiada untuk kata ini.</div>' : ''}</div>`;
  } else if (tab === 1) {
    const f = e.forms || [];
    body = f.length ? `<div class="list forms">${f.map(([l, d]) => `<div class="it"><div class="row"><span class="ms" style="font-size:15px;font-weight:600">${esc(l)}</span><span class="hw">${esc(d)}</span></div></div>`).join('')}</div>`
      : `<div class="pad"><div class="help">Tiada bentuk lain dalam demo ini.</div></div>`;
  } else {
    body = fam && fam.length ? fam.map(([g, items]) => `<div class="grp">${esc(g)}</div><div class="list k">${items.map(x => {
        const m = x.ms ? `<span class="ms">${esc(x.ms)}</span>` : x.en ? `<span class="en">${esc(x.en)}</span>` : '';
        return `<button class="it" data-fam="${x.id}"${x.id == id ? ' disabled' : ''}><div class="row"><span>${m}${x.pat ? ` <span class="sm">· ${x.id && x.pat ? ar(x.pat) : ''}</span>` : ''}</span><span class="hw">${lit(x.d, e.root)}</span></div></button>`;
      }).join('')}</div>`).join('') : `<div class="pad"><div class="help">Tiada kata dasar untuk kata ini.</div></div>`;
  }
  const pg = $('#page');
  pg.hidden = false;
  pg.innerHTML = `<div class="app"><header class="top"><div class="bar"><button class="back" id="back" aria-label="Kembali">←</button><span class="ttl">${esc(e.d)}</span></div></header>
    <div class="hd"><span class="pos">${pos}</span><span class="word">${esc(e.d)}</span></div>
    <div class="tabs">${tabs.map((t, i) => `<button data-tab="${i}" class="${i === tab ? 'on' : ''}">${t}</button>`).join('')}</div>
    ${body}</div>`;
  pg.scrollTop = 0;
  pg.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.id === 'back') return history.back();
    if (b.dataset.tab) return render(id, e, fam, ctx, +b.dataset.tab);
    if (b.dataset.fam) return openEntry(+b.dataset.fam, null);
  };
}
addEventListener('popstate', () => {
  STACK.pop();
  const top = STACK[STACK.length - 1];
  if (top) openEntry(top.id, top.ctx, false); else { $('#page').hidden = true; $('#page').innerHTML = ''; }
});

document.addEventListener('click', ev => {
  const c = ev.target.closest('[data-q]');
  if (c) { $('#q').value = c.dataset.q; show(c.dataset.q); scrollTo(0, 0); return; }
  const o = ev.target.closest('[data-open]');
  if (o) { const r = CURRENT[+o.dataset.open]; openEntry(r.id, r); }
});
$('#q').addEventListener('input', e => show(e.target.value));
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#clear').addEventListener('click', () => { $('#q').value = ''; show(''); $('#q').focus(); });

$('#foot').innerHTML = `<div><b>Jazar</b> · kamus Arab–Melayu luar talian (offline Arabic–Malay dictionary). Demo bukti konsep, November 2026.</div>
  <div>Kredit · Credits: English meanings from CAMeL-Morph (CC BY 4.0) and English Wiktionary via kaikki.org (CC BY-SA 4.0). Some plural forms from English Wiktionary (CC BY-SA 4.0) and Qabas, SinaLab, Birzeit University (CC BY). Fonts: Amiri, Noto Naskh Arabic, Aref Ruqaa, Plus Jakarta Sans (SIL Open Font License).</div>
  <div>The word data on this page is shared under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>. Malay meanings are drafts by the Jazar team, under review.</div>`;

fetch('data/index.json').then(r => r.json()).then(d => {
  IDX = d;
  const q0 = new URL(location.href).searchParams.get('q') || '';
  $('#q').value = q0; show(q0);
});
</script>
</body>
</html>
